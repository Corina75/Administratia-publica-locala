<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrația Publică Locală — ghid interactiv</title>
<meta name="description" content="Ghid interactiv despre administrația publică locală din România: autorități, acte administrative, finanțe publice locale, achiziții publice, patrimoniu, control și transparență.">
<meta name="author" content="Ghid APL">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b3a5c'/%3E%3Cpath d='M32 12 54 24H10z' fill='%23d8b45c'/%3E%3Crect x='16' y='27' width='6' height='19' fill='%23fff'/%3E%3Crect x='29' y='27' width='6' height='19' fill='%23fff'/%3E%3Crect x='42' y='27' width='6' height='19' fill='%23fff'/%3E%3Crect x='10' y='48' width='44' height='6' rx='2' fill='%23d8b45c'/%3E%3C/svg%3E">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#f5f6f8;
  --bg-elev:#ffffff;
  --bg-soft:#eef1f5;
  --text:#16202c;
  --text-muted:#5a6675;
  --text-faint:#84909e;
  --border:#dde3ea;
  --border-strong:#c6d0da;
  --brand:#1b3a5c;
  --brand-soft:#e8eef5;
  --brand-text:#1b3a5c;
  --accent:#a8801f;
  --accent-soft:#fbf3de;
  --ok:#1f6f4a;
  --ok-soft:#e6f4ec;
  --warn:#9a5b06;
  --warn-soft:#fdf0dd;
  --danger:#9c2b2b;
  --shadow:0 1px 2px rgba(16,32,48,.06), 0 8px 24px -12px rgba(16,32,48,.18);
  --radius:14px;
  --radius-sm:9px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sidebar-w:288px;
}
:root[data-theme="dark"]{
  --bg:#0f151c;
  --bg-elev:#161e27;
  --bg-soft:#1c262f;
  --text:#e7edf3;
  --text-muted:#a3b1bf;
  --text-faint:#7d8b99;
  --border:#26323d;
  --border-strong:#36454f;
  --brand:#7fb2e6;
  --brand-soft:#17252f;
  --brand-text:#a8cdf3;
  --accent:#e0b955;
  --accent-soft:#2a2213;
  --ok:#57c08c;
  --ok-soft:#14261d;
  --warn:#e0a955;
  --warn-soft:#2a2113;
  --danger:#e08585;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:16.5px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brand-text);text-underline-offset:2px}
a:hover{opacity:.82}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--bg-elev);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;
}
.brand{
  display:flex;gap:12px;align-items:center;padding:20px 18px 16px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-elev);z-index:2;
}
.brand-mark{
  width:38px;height:38px;border-radius:10px;flex:0 0 38px;
  background:linear-gradient(160deg,var(--brand),#2b5b8c);
  display:grid;place-items:center;color:#fff;font-weight:700;
}
:root[data-theme="dark"] .brand-mark{background:linear-gradient(160deg,#21456b,#132c45);color:#cfe3f8}
.brand-mark svg{width:22px;height:22px}
.brand-title{font-weight:700;font-size:.97rem;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:.72rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.09em;margin-top:2px}
.nav{padding:14px 10px 40px}
.nav-group{margin-bottom:16px}
.nav-group-title{
  font-size:.68rem;text-transform:uppercase;letter-spacing:.11em;color:var(--text-faint);
  padding:6px 10px;font-weight:700;
}
.nav a{
  display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:9px;
  color:var(--text-muted);text-decoration:none;font-size:.9rem;line-height:1.35;
}
.nav a .ico{width:18px;text-align:center;flex:0 0 18px;opacity:.75;font-size:.95rem}
.nav a:hover{background:var(--bg-soft);color:var(--text);opacity:1}
.nav a.active{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.nav a.active .ico{opacity:1}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;gap:12px;align-items:center;
  padding:11px 22px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
}
.topbar .menu-btn{display:none}
.search-wrap{position:relative;flex:1;max-width:520px}
.search-wrap .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:.95rem}
#search{
  width:100%;padding:9px 64px 9px 34px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--bg-elev);color:var(--text);font:inherit;font-size:.92rem;
}
#search:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.kbd{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font:600 .68rem/1 var(--mono);color:var(--text-faint);border:1px solid var(--border-strong);
  border-radius:5px;padding:4px 6px;background:var(--bg-soft);pointer-events:none;
}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{
  border:1px solid var(--border-strong);background:var(--bg-elev);color:var(--text-muted);
  width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:1rem;display:grid;place-items:center;
}
.icon-btn:hover{color:var(--text);border-color:var(--brand)}

.content{padding:34px 22px 90px;width:100%;max-width:920px;margin:0 auto;flex:1}

/* ============ TYPO ============ */
.page-eyebrow{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;color:var(--accent);
  font-weight:700;margin-bottom:8px;
}
h1{font-family:var(--serif);font-size:2.1rem;line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
h2{font-family:var(--serif);font-size:1.42rem;line-height:1.25;margin:38px 0 12px;letter-spacing:-.01em;scroll-margin-top:80px}
h3{font-size:1.05rem;margin:26px 0 8px;letter-spacing:-.005em}
.lede{font-size:1.05rem;color:var(--text-muted);margin:0 0 6px;max-width:64ch}
p{margin:0 0 14px}
.content p, .content li{max-width:none}
ul.list,ol.list{margin:0 0 16px;padding-left:22px}
ul.list li,ol.list li{margin-bottom:7px}
ul.list li::marker{color:var(--accent)}
ol.list li::marker{color:var(--accent);font-weight:700}
strong{font-weight:650}
code{font-family:var(--mono);font-size:.86em;background:var(--bg-soft);padding:1px 5px;border-radius:5px;border:1px solid var(--border)}
hr.sep{border:0;border-top:1px solid var(--border);margin:34px 0}

/* ============ COMPONENTS ============ */
.hero{
  background:linear-gradient(150deg,var(--brand) 0%,#2c5f93 100%);
  color:#fff;border-radius:var(--radius);padding:30px 28px;margin-bottom:26px;box-shadow:var(--shadow);
}
:root[data-theme="dark"] .hero{background:linear-gradient(150deg,#16344f 0%,#1d4467 100%)}
.hero h1{color:#fff;margin-bottom:10px}
.hero p{color:#dbe7f3;margin:0;max-width:60ch}
.hero .page-eyebrow{color:#e8c86e}

.grid{display:grid;gap:14px;margin:0 0 18px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 17px;box-shadow:var(--shadow);
}
.card h4{margin:0 0 6px;font-size:.98rem;letter-spacing:-.005em}
.card p{margin:0;font-size:.9rem;color:var(--text-muted)}
.card .card-ico{font-size:1.25rem;display:block;margin-bottom:8px}

.note{
  border-radius:var(--radius-sm);padding:13px 15px;margin:0 0 18px;font-size:.93rem;
  border:1px solid var(--border);background:var(--bg-elev);border-left:4px solid var(--brand);
}
.note b{display:block;margin-bottom:3px;font-size:.87rem;letter-spacing:.01em}
.note p:last-child{margin-bottom:0}
.note.info{border-left-color:var(--brand);background:var(--brand-soft)}
.note.law{border-left-color:var(--accent);background:var(--accent-soft)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.ok{border-left-color:var(--ok);background:var(--ok-soft)}

.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-elev);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:min(100%,520px)}
caption{caption-side:top;text-align:left;padding:12px 15px 0;font-size:.82rem;color:var(--text-faint)}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
thead th{background:var(--bg-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg-soft)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}

.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 18px}
.steps li{
  counter-increment:s;position:relative;padding:0 0 16px 46px;border-left:2px solid var(--border);
  margin-left:15px;
}
.steps li:last-child{border-left-color:transparent;padding-bottom:0}
.steps li::before{
  content:counter(s);position:absolute;left:-16px;top:-2px;width:30px;height:30px;border-radius:50%;
  background:var(--brand);color:#fff;display:grid;place-items:center;font-size:.82rem;font-weight:700;
}
:root[data-theme="dark"] .steps li::before{background:#21456b;color:#cfe3f8}
.steps b{display:block;margin-bottom:2px}
.steps span{color:var(--text-muted);font-size:.92rem}

dl.defs{margin:0 0 18px}
dl.defs div{padding:10px 0;border-bottom:1px solid var(--border)}
dl.defs div:last-child{border-bottom:0}
dl.defs dt{font-weight:650;font-size:.94rem}
dl.defs dd{margin:2px 0 0;color:var(--text-muted);font-size:.92rem}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}
.chip{
  font-size:.78rem;padding:4px 10px;border-radius:99px;border:1px solid var(--border-strong);
  background:var(--bg-elev);color:var(--text-muted);white-space:nowrap;
}
.chip.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}

.links{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:10px}
.links li a{
  display:block;padding:13px 15px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-elev);text-decoration:none;color:var(--text);
}
.links li a:hover{border-color:var(--brand);opacity:1}
.links b{display:block;font-size:.95rem}
.links span{font-size:.86rem;color:var(--text-muted)}

/* ---- widgets ---- */
.calc{
  border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-elev);
  padding:18px;margin:0 0 20px;box-shadow:var(--shadow);
}
.calc h4{margin:0 0 4px;font-size:1rem}
.calc .calc-hint{font-size:.85rem;color:var(--text-faint);margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.82rem;font-weight:600;color:var(--text-muted)}
.field input,.field select{
  padding:9px 11px;border-radius:9px;border:1px solid var(--border-strong);
  background:var(--bg);color:var(--text);font:inherit;font-size:.93rem;
}
.field input:focus,.field select:focus{outline:2px solid var(--brand);outline-offset:1px}
.calc-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.calc-out{margin-top:6px;border-top:1px dashed var(--border-strong);padding-top:14px}
.out-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.out-box{background:var(--bg-soft);border-radius:var(--radius-sm);padding:11px 13px}
.out-box .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);font-weight:700}
.out-box .v{font-size:1.32rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px}
.out-box .v small{font-size:.8rem;font-weight:500;color:var(--text-muted)}
.verdict{
  margin-top:12px;padding:13px 15px;border-radius:var(--radius-sm);
  background:var(--brand-soft);border-left:4px solid var(--brand);font-size:.93rem;
}
.verdict b{display:block;font-size:1rem;margin-bottom:3px}

/* ---- search results ---- */
.results-head{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.results-head h1{font-size:1.5rem;margin:0}
.result{
  display:block;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-elev);text-decoration:none;color:inherit;margin-bottom:10px;
}
.result:hover{border-color:var(--brand);opacity:1}
.result .r-sec{font-size:.73rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}
.result .r-txt{font-size:.92rem;color:var(--text-muted);margin-top:4px}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px;font-weight:600}
:root[data-theme="dark"] mark{background:#4a3c10;color:#f3dfa4}
.empty{text-align:center;padding:60px 20px;color:var(--text-faint)}

.pager{display:flex;gap:12px;justify-content:space-between;margin-top:46px;padding-top:22px;border-top:1px solid var(--border)}
.pager a{
  display:block;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-elev);text-decoration:none;color:var(--text);flex:1;max-width:48%;
}
.pager a:hover{border-color:var(--brand);opacity:1}
.pager .dir{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:700}
.pager .ttl{font-size:.93rem;font-weight:600;margin-top:2px}
.pager a.next{text-align:right;margin-left:auto}

.footer{
  border-top:1px solid var(--border);padding:22px;text-align:center;
  font-size:.83rem;color:var(--text-faint);
}
.footer a{color:var(--text-muted)}

.toc{
  background:var(--bg-soft);border-radius:var(--radius);padding:14px 18px;margin:0 0 24px;
  border:1px solid var(--border);
}
.toc b{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint)}
.toc ul{margin:8px 0 0;padding-left:18px;columns:2;column-gap:26px}
.toc li{margin-bottom:4px;font-size:.89rem;break-inside:avoid}

.flash{animation:flash 1.8s ease}
@keyframes flash{0%,35%{background:var(--accent-soft);box-shadow:0 0 0 8px var(--accent-soft)}100%{background:transparent;box-shadow:none}}

/* ============ RESPONSIVE ============ */
.scrim{display:none}
@media (max-width:900px){
  body{font-size:16px}
  .sidebar{
    position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:var(--shadow);
  }
  body.nav-open .sidebar{transform:translateX(0)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,18,26,.5);z-index:35}
  .topbar .menu-btn{display:grid}
  .content{padding:24px 16px 70px}
  h1{font-size:1.7rem}
  h2{font-size:1.25rem}
  .kbd{display:none}
  .toc ul{columns:1}
  .pager a{max-width:none}
  .hero{padding:22px 18px}
}
@media print{
  .sidebar,.topbar,.pager,.scrim{display:none!important}
  .content{max-width:none;padding:0}
  .card,.note,.table-wrap,.calc{box-shadow:none}
  body{font-size:11pt}
  section{display:block!important;page-break-after:always}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="currentColor"><path d="M32 6 60 22H4z"/><rect x="12" y="26" width="7" height="22"/><rect x="28" y="26" width="7" height="22"/><rect x="44" y="26" width="7" height="22"/><rect x="4" y="51" width="56" height="7" rx="2"/></svg>
      </div>
      <div>
        <div class="brand-title">Administrația Publică Locală</div>
        <div class="brand-sub">Ghid interactiv</div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Cuprins"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Meniu">☰</button>
      <div class="search-wrap">
        <span class="mag" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Caută în ghid: cvorum, buget, praguri, PAAP…" autocomplete="off" aria-label="Caută în ghid">
        <span class="kbd">/</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="printBtn" aria-label="Tipărește" title="Tipărește / Salvează ca PDF">⎙</button>
        <button class="icon-btn" id="themeBtn" aria-label="Schimbă tema" title="Temă deschisă / întunecată">◐</button>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
    <footer class="footer">
      <p><strong>Ghid interactiv — Administrația Publică Locală din România</strong><br>
      Material informativ, fără valoare de consultanță juridică. Verificați întotdeauna forma în vigoare a actelor normative pe
      <a href="https://legislatie.just.ro" target="_blank" rel="noopener">legislatie.just.ro</a>.</p>
      <p id="footYear"></p>
    </footer>
  </div>
</div>
<script>
/* ====================================================================
   DATE — conținutul ghidului.
   Structura: secțiuni -> blocuri. Tipuri de blocuri:
   h (titlu), p (paragraf), ul/ol (listă), table, cards, note, steps,
   defs (glosar), chips (temeiuri legale), links, widget, toc
   ==================================================================== */
const DATA = [
/* ---------------------------------------------------------------- 1 */
{
  id:"acasa", group:"Cadrul general", ico:"⌂",
  title:"Despre administrația publică locală",
  eyebrow:"Prezentare",
  lede:"Ce este administrația publică locală, cine o exercită și cum este organizată în România.",
  hero:true,
  blocks:[
    {t:"p",x:"<b>Administrația publică locală (APL)</b> este ansamblul autorităților și structurilor prin care colectivitățile locale — comune, orașe, municipii și județe — își rezolvă singure treburile publice, în numele și în interesul locuitorilor lor. Spre deosebire de administrația centrală, autoritățile locale nu sunt subordonate Guvernului: ele sunt <b>alese de cetățeni</b> și dispun de <b>autonomie locală</b>, în limitele legii."},
    {t:"note",k:"info",b:"Ideea de bază",x:"Autonomia locală înseamnă dreptul și capacitatea efectivă a autorităților alese de a soluționa și gestiona, în numele și în interesul colectivității locale, o parte importantă a treburilor publice — pe propria răspundere și în condițiile legii (art. 5 lit. j) și art. 75 din Codul administrativ; art. 3 din Carta europeană a autonomiei locale)."},
    {t:"h",x:"Cele patru coordonate ale sistemului"},
    {t:"cards",x:[
      {i:"🏛️",t:"Colectivitatea locală",x:"Totalitatea locuitorilor din unitatea administrativ-teritorială. Ei aleg autoritățile, pot fi consultați prin referendum și participă la deciziile publice."},
      {i:"🗳️",t:"Autoritățile alese",x:"Consiliul local / consiliul județean (autorități deliberative) și primarul / președintele consiliului județean (autorități executive)."},
      {i:"📜",t:"Actele administrative",x:"Hotărâri ale consiliului și dispoziții ale executivului — supuse controlului de legalitate al prefectului și instanței de contencios administrativ."},
      {i:"💶",t:"Resursele",x:"Buget local propriu, patrimoniu propriu (domeniu public și privat) și personal propriu — aparatul de specialitate."}
    ]},
    {t:"h",x:"Ce găsiți în acest ghid"},
    {t:"p",x:"Ghidul acoperă întregul ciclu de activitate al unei primării sau al unui consiliu județean: de la constituirea autorităților și adoptarea actelor, la buget, achiziții, patrimoniu, servicii publice, urbanism, control și transparență. Fiecare capitol indică temeiul legal, iar două instrumente de calcul (componența consiliului local și pragurile de achiziții) transformă regulile în răspunsuri concrete."},

      "<b>Universalitatea</b> — veniturile și cheltuielile se includ în buget în totalitate, în sume brute.",
      "<b>Transparența și publicitatea</b> — proiectul și execuția se publică; dezbaterea este publică.",
      "<b>Unitatea</b> — veniturile și cheltuielile se înscriu într-un singur document.",
      "<b>Anualitatea</b> — bugetul se aprobă pentru un exercițiu bugetar egal cu anul calendaristic.",
      "<b>Specializarea bugetară</b> — veniturile și cheltuielile se înscriu pe surse și destinații, potrivit clasificației bugetare.",
      "<b>Unitatea monetară</b> — operațiunile se exprimă în lei.",
      "<b>Echilibrul</b> — cheltuielile trebuie să fie echilibrate cu veniturile; <b>bugetul local nu se aprobă cu deficit</b>.",
      "<b>Solidaritatea, autonomia locală financiară, proporționalitatea și consultarea</b> — reguli care guvernează relațiile dintre bugetul de stat și bugetele locale."
    ]},
    {t:"h",x:"Structura bugetului local"},
    {t:"table",head:["Componentă","Conținut"],rows:[
      ["Secțiunea de funcționare","Venituri și cheltuieli curente, necesare funcționării curente a instituțiilor și serviciilor publice (salarii, bunuri și servicii, transferuri curente, dobânzi)."],
      ["Secțiunea de dezvoltare","Cheltuieli de capital, proiecte cu finanțare europeană, transferuri pentru investiții; se finanțează din excedent, împrumuturi, sume din secțiunea de funcționare, fonduri externe."],
      ["Bugetul instituțiilor finanțate integral sau parțial din venituri proprii","Bugete anexă, aprobate odată cu bugetul local."],
      ["Bugetul creditelor interne / externe și al fondurilor externe nerambursabile","Evidențiază distinct împrumuturile și fondurile europene."]
    ]},
    {t:"h",x:"Calendarul bugetar"},
    {t:"steps",x:[
      {t:"Scrisoarea-cadru",x:"Ministerul Finanțelor transmite, până la 1 iunie, limitele și metodologia pentru elaborarea proiectelor de buget."},
      {t:"Elaborarea proiectului",x:"Ordonatorul principal de credite elaborează proiectul de buget pe baza propunerilor ordonatorilor subordonați și a estimărilor de venituri proprii."},
      {t:"Publicarea proiectului",x:"Proiectul se publică în presa locală sau se afișează la sediul UAT; locuitorii pot depune contestații în <b>15 zile</b> de la publicare."},
      {t:"Aprobarea",x:"Bugetul se aprobă prin hotărâre a autorității deliberative, în termen de <b>45 de zile</b> de la data publicării legii bugetului de stat în Monitorul Oficial."},
      {t:"Execuția",x:"Repartizarea pe trimestre, deschiderea de credite, angajarea și plata cheltuielilor, încasarea veniturilor, rectificări bugetare, virări de credite."},
      {t:"Încheierea exercițiului",x:"Întocmirea contului anual de execuție și a situațiilor financiare; aprobarea contului de execuție prin hotărâre a consiliului; stabilirea excedentului sau deficitului."}
    ]},
    {t:"note",k:"warn",b:"Dacă bugetul nu este aprobat la timp",x:"Până la aprobarea bugetului, cheltuielile se efectuează lunar în limita a <b>1/12 din prevederile bugetului anului precedent</b>, cu excepția cazurilor deosebite, justificate. Neaprobarea în termenele legale atrage măsuri prevăzute de Legea nr. 273/2006 privind finanțarea."},
    {t:"h",x:"Veniturile bugetului local"},
    {t:"table",head:["Categorie","Exemple"],rows:[
      ["Venituri proprii","Impozite și taxe locale (clădiri, teren, mijloace de transport), taxe pentru eliberarea de avize și autorizații, venituri din concesiuni și închirieri, din vânzarea bunurilor, din amenzi, taxe speciale."],
      ["Cote și sume defalcate din impozitul pe venit","Repartizate potrivit legii bugetului de stat; o parte este destinată echilibrării bugetelor locale, prin consiliul județean."],
      ["Sume defalcate din TVA","Pentru finanțarea unor cheltuieli descentralizate: învățământ, asistență socială, drumuri, echilibrare."],
      ["Subvenții","De la bugetul de stat sau de la alte bugete, pentru programe și investiții determinate."],
      ["Fonduri externe nerambursabile","Programe operaționale, PNRR, Fondul pentru Mediu, programe transfrontaliere."],
      ["Donații și sponsorizări","Se cuprind în buget prin rectificare, cu respectarea destinației."]
    ]},
    {t:"h",x:"Excedentul și datoria publică locală"},
    {t:"ul",x:[
      "<b>Excedentul</b> anual se reportează în anul următor și se utilizează, prin hotărâre a autorității deliberative, pentru finanțarea secțiunii de dezvoltare, pentru acoperirea temporară a golurilor de casă sau pentru acoperirea deficitului secțiunii de funcționare.",
      "<b>Împrumuturile</b> se contractează numai cu avizul <b>Comisiei de autorizare a împrumuturilor locale (CAÎL)</b> și cu aprobarea autorității deliberative, cu majoritate absolută.",
      "<b>Plafonul de îndatorare</b>: totalul datoriilor anuale (rate, dobânzi, comisioane) nu poate depăși <b>30% din media veniturilor proprii ale ultimilor 3 ani</b>, cu excepțiile prevăzute de lege.",
      "<b>Garanțiile</b> acordate de UAT se înregistrează în registrul de evidență a datoriei publice locale și a garanțiilor locale."
    ]},
    {t:"note",k:"law",b:"Temeiuri",x:"Legea nr. 273/2006 privind finanțele publice locale; Legea nr. 500/2002 privind finanțele publice; legile anuale ale bugetului de stat; Ordinul MFP nr. 1954/2005 privind clasificația indicatorilor finanțelor publice."}
  ]
},

{
  id:"executie", group:"Bani publici", ico:"📊",
  title:"Execuția bugetară, ALOP și contabilitatea publică",
  eyebrow:"Execuție",
  lede:"Cele patru faze ale cheltuielii, controlul financiar preventiv, contabilitatea și raportările obligatorii.",
  blocks:[
    {t:"h",x:"Ordonatorii de credite"},
    {t:"table",head:["Tip","Cine este","Rol"],rows:[
      ["Ordonator <b>principal</b>","Primarul / președintele consiliului județean","Repartizează creditele bugetare aprobate, aprobă efectuarea cheltuielilor, răspunde de utilizarea legală și eficientă a fondurilor."],
      ["Ordonator <b>secundar</b>","Conducătorii instituțiilor cu ordonatori în subordine","Repartizează credite către ordonatorii terțiari și aprobă cheltuieli proprii."],
      ["Ordonator <b>terțiar</b>","Conducătorii instituțiilor subordonate (școli, spitale, servicii publice)","Utilizează creditele repartizate exclusiv pentru destinațiile aprobate."]
    ]},
    {t:"note",k:"warn",b:"Răspunderea ordonatorului",x:"Ordonatorii de credite răspund de: angajarea și utilizarea creditelor în limita și cu destinația aprobată; realizarea veniturilor; integritatea bunurilor; organizarea contabilității și a controlului financiar preventiv propriu; raportarea la termen a situațiilor financiare."},
    {t:"h",x:"Fazele execuției cheltuielilor — ALOP"},
    {t:"steps",x:[
      {t:"Angajarea",x:"Actul prin care se creează sau se constată obligații de plată: contract, comandă, decizie. Presupune <b>angajament bugetar</b> (rezervarea creditului) și <b>angajament legal</b> (documentul juridic). Propunerea de angajare și angajamentul bugetar se supun vizei de control financiar preventiv."},
      {t:"Lichidarea",x:"Verificarea existenței obligației de plată și a realității serviciului efectuat („bun de plată”), pe baza documentelor justificative: factură, proces-verbal de recepție, situație de lucrări."},
      {t:"Ordonanțarea",x:"Actul prin care se dispune plata: ordonanțarea de plată, semnată de ordonatorul de credite, cu viză de control financiar preventiv."},
      {t:"Plata",x:"Achitarea efectivă a sumei, prin trezorerie, în limita disponibilului și a creditelor deschise. Se efectuează de persoana cu atribuții financiar-contabile."}
    ]},
    {t:"note",k:"info",b:"Separarea atribuțiilor",x:"Primele trei faze (angajare, lichidare, ordonanțare) sunt în competența ordonatorului de credite, iar plata se efectuează de persoana desemnată cu atribuții financiar-contabile. Aceeași persoană nu poate exercita, pentru aceeași operațiune, atât atribuții de ordonanțare, cât și de plată."},
    {t:"h",x:"Controlul financiar preventiv propriu (CFPP)"},
    {t:"ul",x:[
      "Se exercită asupra tuturor operațiunilor care afectează fondurile publice sau patrimoniul public, <b>înainte</b> de aprobarea lor.",
      "Viza se acordă de persoane desemnate prin act de decizie internă, cu pregătire de specialitate; persoana care acordă viza <b>nu poate fi implicată</b> în efectuarea operațiunii supuse vizei.",
      "Se organizează pe baza unui <b>cadru general</b> și a unui <b>cadru specific</b> de operațiuni supuse vizei, aprobat de conducătorul entității.",
      "Refuzul de viză se face în scris și motivat; operațiunea poate fi efectuată <b>pe răspunderea ordonatorului</b>, cu informarea structurilor de control.",
      "Se raportează trimestrial situația operațiunilor vizate și a refuzurilor de viză."
    ]},
    {t:"h",x:"Contabilitatea instituțiilor publice"},
    {t:"ul",x:[
      "Se conduce în <b>partidă dublă</b>, pe bază de <b>angajamente</b> (contabilitate de drepturi și obligații) și, complementar, pe bază de <b>numerar</b> pentru execuția bugetară.",
      "Planul de conturi și normele metodologice sunt aprobate prin <b>OMFP nr. 1.917/2005</b>, cu modificările ulterioare.",
      "Registrele obligatorii: Registrul-jurnal, Registrul-inventar, Cartea mare.",
      "<b>Inventarierea</b> elementelor de natura activelor, datoriilor și capitalurilor proprii se efectuează cel puțin o dată pe an, potrivit <b>OMFP nr. 2.861/2009</b>.",
      "<b>Reevaluarea</b> activelor fixe corporale de natura construcțiilor și terenurilor se efectuează cel puțin o dată la 3 ani (OG nr. 81/2003).",
      "<b>Amortizarea</b> activelor fixe se calculează liniar, potrivit duratelor normale de funcționare (HG nr. 2.139/2004)."
    ]},
    {t:"h",x:"Raportări și situații financiare"},
    {t:"table",head:["Raportare","Periodicitate","Conținut uzual"],rows:[
      ["Situații financiare trimestriale","Trimestrial","Bilanț, contul de rezultat patrimonial, contul de execuție, situația activelor și datoriilor, note explicative, anexe."],
      ["Situații financiare anuale","Anual","Aceleași formulare, în formă completă, însoțite de raportul de analiză pe bază de bilanț."],
      ["Contul anual de execuție bugetară","Anual","Se aprobă prin hotărâre a autorității deliberative; se publică în Monitorul Oficial Local."],
      ["Raportări prin sistemul FOREXEBUG","Lunar / la operațiune","Buget individual, angajamente legale și bugetare, plăți, balanța de verificare; controlul angajamentelor se realizează la nivelul trezoreriei."],
      ["Raportarea privind plățile restante și arieratele","Lunar","Monitorizarea obligațiilor neachitate la termen."]
    ]},
    {t:"note",k:"warn",b:"Reguli frecvent verificate în control",x:"Angajarea de cheltuieli fără credite bugetare aprobate; efectuarea de plăți fără documente justificative; depășirea plafonului de casă; neînregistrarea în contabilitate a bunurilor din domeniul public; nereevaluarea și neamortizarea activelor; neconstituirea garanțiilor materiale ale gestionarilor (Legea nr. 22/1969)."},
    {t:"note",k:"law",b:"Temeiuri",x:"Legea contabilității nr. 82/1991; OMFP nr. 1.792/2002 (ALOP); OG nr. 119/1999 și OMFP nr. 923/2014 (CFPP); OMFP nr. 1.917/2005; OMFP nr. 2.861/2009; Legea nr. 273/2006."}
  ]
},

{
  id:"fiscalitate", group:"Bani publici", ico:"🧾",
  title:"Impozite și taxe locale",

  blocks:[

    {t:"table",head:["Categorie","Obiect","Observații"],rows:[
      ["Impozitul / taxa pe clădiri","Clădiri rezidențiale, nerezidențiale și mixte, deținute de persoane fizice și juridice","Taxa pe clădiri se datorează de concesionari, locatari sau administratori ai clădirilor din proprietate publică/privată a statului sau a UAT"],

      ["Alte taxe locale","Utilizarea temporară a locurilor publice, vizitarea muzeelor, deținerea de utilaje, vehicule lente","Nivelurile se aprobă anual prin hotărâre a consiliului local"]

    {t:"h",x:"Cum se stabilesc"},

      "Nivelurile impozitelor și taxelor locale se stabilesc prin <b>hotărâre a consiliului local</b>, în limitele și condițiile Codului fiscal.",
      "Sumele fixe prevăzute de Codul fiscal se <b>indexează anual</b> cu rata inflației, prin hotărâre adoptată, ca regulă, până la <b>30 aprilie</b> a anului curent, pentru anul fiscal următor.",
      "Consiliul local poate acorda <b>scutiri și reduceri</b> în cazurile permise expres de Codul fiscal (clădiri utilizate de ONG-uri, persoane cu venituri reduse, clădiri afectate de calamități, reabilitări termice etc.).",

      "Hotărârea privind impozitele și taxele locale se supune procedurii de <b>transparență decizională</b> și se publică în Monitorul Oficial Local."

      ["Declararea dobândirii / înstrăinării unei clădiri, unui teren sau a unui mijloc de transport","30 de zile de la data dobândirii / înstrăinării"],

  blocks:[

    {t:"steps",x:[
      {t:"Identificarea necesității",x:"Compartimentele întocmesc <b>referate de necesitate</b>, fundamentate valoric, până la data stabilită de conducere (de regulă în trimestrul IV, pentru anul următor)."},
      {t:"Programul anual al achizițiilor publice (PAAP)",x:"Se elaborează pe baza referatelor și a proiectului de buget, se aprobă de conducătorul autorității și se actualizează ori de câte ori este necesar; se publică în SEAP."},

    {t:"note",k:"law",b:"Valori aplicabile în perioada 2026–2027",x:"Pragurile europene se actualizează din doi în doi ani prin regulamente delegate ale Comisiei Europene și se exprimă în lei la cursul stabilit prin notificare ANAP. Valorile de mai jos se aplică <b>de la 1 ianuarie 2026</b> (Regulamentele delegate (UE) 2025/2150, 2025/2151 și 2025/2152). Pragurile pentru <b>achiziția directă</b> sunt sume fixe în lei, prevăzute de art. 7 alin. (5) din Legea nr. 98/2016, nemodificate din 2022."},

      ["<b>Achiziție directă</b> — produse și servicii","sub 270.120","—"],

    {t:"table",head:["Procedură","Când se folosește"],rows:[
      ["Licitație deschisă","Procedura de bază, la sau peste pragurile europene; orice operator poate depune ofertă."],

    {t:"note",k:"info",b:"Termene minime uzuale (procedura simplificată)",x:"10 zile pentru contractele de produse și servicii; 6 zile pentru produse de complexitate redusă; 15 zile pentru contractele de lucrări — calculate de la transmiterea spre publicare a anunțului (art. 113 din Legea nr. 98/2016). Pentru licitația deschisă, termenul standard este de 35 de zile, cu reducerile permise de lege."},

(function(){
"use strict";

var $ = function(s,c){return (c||document).querySelector(s);};
var nav = $("#nav"), content = $("#content"), search = $("#search");

/* ---------- utilitare ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function strip(h){return String(h).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();}
function fold(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[țţ]/g,"t").replace(/[șş]/g,"s");}
function nf(n){return new Intl.NumberFormat("ro-RO").format(n);}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

/* ---------- randarea blocurilor ---------- */
function block(b, sid, hi){
  switch(b.t){
    case "h":
      return '<h2 id="'+sid+'-h'+hi+'">'+b.x+'</h2>';
    case "p":
      return "<p>"+b.x+"</p>";
    case "ul":
      return '<ul class="list">'+b.x.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ul>";
    case "ol":
      return '<ol class="list">'+b.x.map(function(i){return "<li>"+i+"</li>";}).join("")+"</ol>";
    case "table":
      return '<div class="table-wrap"><table>'+
        (b.cap?"<caption>"+b.cap+"</caption>":"")+
        "<thead><tr>"+b.head.map(function(h){return "<th>"+h+"</th>";}).join("")+"</tr></thead><tbody>"+
        b.rows.map(function(r){return "<tr>"+r.map(function(c,i){
          return '<td'+(i>0&&/^[\d.,\s–—-]+$/.test(strip(c))?' class="num"':"")+">"+c+"</td>";}).join("")+"</tr>";}).join("")+
        "</tbody></table></div>";
    case "cards":
      return '<div class="grid c2">'+b.x.map(function(c){
        return '<div class="card">'+(c.i?'<span class="card-ico" aria-hidden="true">'+c.i+"</span>":"")+
          "<h4>"+c.t+"</h4><p>"+c.x+"</p></div>";}).join("")+"</div>";
    case "note":
      return '<div class="note '+(b.k||"info")+'">'+(b.b?"<b>"+b.b+"</b>":"")+"<p>"+b.x+"</p></div>";
    case "steps":
      return '<ol class="steps">'+b.x.map(function(s){
        return "<li><b>"+s.t+"</b><span>"+s.x+"</span></li>";}).join("")+"</ol>";
    case "defs":
      return '<dl class="defs">'+b.x.map(function(d){
        return "<div><dt>"+d.t+"</dt><dd>"+d.x+"</dd></div>";}).join("")+"</dl>";
    case "chips":
      return '<div class="chips">'+b.x.map(function(c){return '<span class="chip accent">'+c+"</span>";}).join("")+"</div>";
    case "links":
      return '<ul class="links">'+b.x.map(function(l){
        return '<li><a href="'+l.u+'" target="_blank" rel="noopener"><b>'+l.t+"</b><span>"+l.x+"</span></a></li>";}).join("")+"</ul>";
    case "widget":
      return '<div id="w-'+b.w+'"></div>';
    default:
      return "";
  }
}

/* ---------- navigație ---------- */
function buildNav(){
  var groups = [], map = {};
  DATA.forEach(function(s){
    if(!map[s.group]){ map[s.group] = []; groups.push(s.group); }
    map[s.group].push(s);
  });
  nav.innerHTML = groups.map(function(g){
    return '<div class="nav-group"><div class="nav-group-title">'+g+"</div>"+
      map[g].map(function(s){
        return '<a href="#'+s.id+'" data-id="'+s.id+'"><span class="ico" aria-hidden="true">'+s.ico+"</span><span>"+s.title+"</span></a>";
      }).join("")+"</div>";
  }).join("");
}
function markNav(id){
  Array.prototype.forEach.call(nav.querySelectorAll("a"),function(a){
    a.classList.toggle("active", a.getAttribute("data-id")===id);
  });
}

/* ---------- randarea unei secțiuni ---------- */
function renderSection(id){
  var idx = DATA.findIndex(function(s){return s.id===id;});
  if(idx<0){ idx = 0; }
  var s = DATA[idx], hi = 0, headings = [];
  var body = s.blocks.map(function(b,i){
    if(b.t==="h"){ hi++; headings.push({t:strip(b.x), a:s.id+"-h"+hi}); }
    return '<div data-b="'+i+'">'+block(b, s.id, hi)+"</div>";
  }).join("");

  var head = s.hero
    ? '<div class="hero"><div class="page-eyebrow">'+s.eyebrow+"</div><h1>"+s.title+"</h1><p>"+s.lede+"</p></div>"
    : '<div class="page-eyebrow">'+s.eyebrow+"</div><h1>"+s.title+'</h1><p class="lede">'+s.lede+"</p>";

  var toc = headings.length>=3
    ? '<div class="toc"><b>În acest capitol</b><ul>'+headings.map(function(h){
        return '<li><a href="#'+h.a+'">'+esc(h.t)+"</a></li>";}).join("")+"</ul></div>"
    : "";

  var prev = DATA[idx-1], next = DATA[idx+1];
  var pager = '<div class="pager">'+
    (prev?'<a href="#'+prev.id+'"><div class="dir">← Anterior</div><div class="ttl">'+esc(prev.title)+"</div></a>":"<span></span>")+
    (next?'<a class="next" href="#'+next.id+'"><div class="dir">Următor →</div><div class="ttl">'+esc(next.title)+"</div></a>":"")+
    "</div>";

  content.innerHTML = head + toc + body + pager;
  document.title = s.title + " — Administrația Publică Locală";
  markNav(s.id);
  mountWidgets();
}

/* ---------- căutare ---------- */
var INDEX = [];
function buildIndex(){
  DATA.forEach(function(s){
    INDEX.push({sid:s.id, sec:s.title, b:0, txt:s.title+" "+s.lede, disp:s.lede});
    s.blocks.forEach(function(b,i){
      var txt = "";
      if(b.t==="h"||b.t==="p") txt = strip(b.x);
      else if(b.t==="ul"||b.t==="ol"||b.t==="chips") txt = b.x.map(strip).join(" · ");
      else if(b.t==="table") txt = strip(b.head.join(" ")) + " — " + b.rows.map(function(r){return strip(r.join(" · "));}).join(" | ");
      else if(b.t==="cards"||b.t==="steps"||b.t==="defs") txt = b.x.map(function(c){return strip(c.t)+": "+strip(c.x);}).join(" | ");
      else if(b.t==="note") txt = (b.b?strip(b.b)+": ":"")+strip(b.x);
      else if(b.t==="links") txt = b.x.map(function(l){return strip(l.t)+" "+strip(l.x);}).join(" | ");
      if(txt) INDEX.push({sid:s.id, sec:s.title, b:i, txt:txt, disp:txt});
    });
  });
}
function snippet(txt, q){
  var f = fold(txt), p = f.indexOf(q);
  if(p<0) p = 0;
  var start = Math.max(0, p-70), end = Math.min(txt.length, p+190);
  var out = (start>0?"…":"") + txt.slice(start,end) + (end<txt.length?"…":"");
  var re = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  // evidențiere pe textul „pliat”, aplicată pozițional
  var folded = fold(out), res = "", last = 0, m;
  while((m = re.exec(folded))!==null){
    res += esc(out.slice(last, m.index)) + "<mark>" + esc(out.slice(m.index, m.index+m[0].length)) + "</mark>";
    last = m.index + m[0].length;
    if(m[0].length===0) break;
  }
  res += esc(out.slice(last));
  return res;
}
function runSearch(qRaw){
  var q = fold(qRaw.trim());
  if(q.length<2){ route(); return; }
  var hits = [];
  for(var i=0;i<INDEX.length && hits.length<60;i++){
    if(fold(INDEX[i].txt).indexOf(q)>=0) hits.push(INDEX[i]);
  }
  markNav("");
  content.innerHTML =
    '<div class="results-head"><h1>Rezultate</h1><span class="lede">'+hits.length+
      (hits.length===1?" potrivire":" potriviri")+' pentru „'+esc(qRaw.trim())+'”</span></div>'+
    (hits.length? hits.map(function(h){
      return '<a class="result" href="#'+h.sid+'" data-b="'+h.b+'"><div class="r-sec">'+esc(h.sec)+
        '</div><div class="r-txt">'+snippet(h.disp, q)+"</div></a>";
    }).join("")
    : '<div class="empty"><p style="font-size:2rem;margin:0">⌕</p><p>Niciun rezultat. Încercați alt termen — de exemplu <b>cvorum</b>, <b>buget</b>, <b>prag</b>, <b>inventar</b>, <b>prefect</b>.</p></div>');
  document.title = "Căutare: "+qRaw.trim()+" — Administrația Publică Locală";
}

var SCALA = [[1500,9],[3000,11],[5000,13],[10000,15],[20000,17],[50000,19],[100000,21],[200000,23],[400000,27],[Infinity,31]];
function consilieriPentru(loc){
  for(var i=0;i<SCALA.length;i++) if(loc<=SCALA[i][0]) return SCALA[i][1];
  return 31;
}
function consiliuHTML(){
  return '<div class="calc">'+
    "<h4>Calculator — componența consiliului local și majoritățile</h4>"+
    '<p class="calc-hint">Introduceți numărul de locuitori și, opțional, numărul consilierilor prezenți la ședință.</p>'+
    '<div class="calc-row">'+
      '<div class="field"><label for="c-loc">Număr de locuitori</label><input id="c-loc" type="number" min="0" step="1" value="3500"></div>'+
      '<div class="field"><label for="c-prez">Consilieri prezenți (opțional)</label><input id="c-prez" type="number" min="0" step="1" placeholder="ex. 9"></div>'+
    "</div>"+
    '<div class="calc-out"><div class="out-grid">'+
      '<div class="out-box"><div class="k">Consilieri în funcție</div><div class="v" id="c-total">–</div></div>'+
      '<div class="out-box"><div class="k">Cvorum de ședință</div><div class="v" id="c-cvorum">–</div></div>'+
      '<div class="out-box"><div class="k">Majoritate absolută</div><div class="v" id="c-abs">–</div></div>'+
      '<div class="out-box"><div class="k">Majoritate calificată (2/3)</div><div class="v" id="c-cal">–</div></div>'+
    "</div>"+
    '<div class="verdict" id="c-verdict"></div></div></div>';
}
function bindConsiliu(){
  var loc = $("#c-loc"), prez = $("#c-prez");
  function calc(){
    var n = consilieriPentru(Math.max(0, parseInt(loc.value,10)||0));
    var cvorum = Math.floor(n/2)+1;
    var cal = Math.ceil(n*2/3);
    $("#c-total").textContent = n;
    $("#c-cvorum").textContent = cvorum;
    $("#c-abs").textContent = cvorum;
    $("#c-cal").textContent = cal;
    var p = parseInt(prez.value,10);
    var v = $("#c-verdict"), msg;
    if(!isNaN(p) && p>0){
      var simpla = Math.floor(p/2)+1;
      if(p>n){
        msg = "<b>Verificați datele</b>Numărul consilierilor prezenți ("+p+") nu poate depăși numărul consilierilor în funcție ("+n+").";
      } else if(p < cvorum){
        msg = "<b>Ședința nu este legal constituită</b>Cu "+p+" consilieri prezenți nu este întrunit cvorumul de "+cvorum+
          " (majoritatea consilierilor în funcție). Ședința se reprogramează.";
      } else {
        msg = "<b>Ședința este legal constituită</b>Cu "+p+" consilieri prezenți: majoritate <b>simplă</b> = <b>"+simpla+
          "</b> voturi; majoritate <b>absolută</b> = <b>"+cvorum+"</b> voturi; majoritate <b>calificată</b> = <b>"+cal+"</b> voturi.";
      }
    } else {
      msg = "<b>Consiliu de "+n+" consilieri</b>Cvorumul de ședință și majoritatea absolută sunt de <b>"+cvorum+
        "</b> consilieri, iar majoritatea calificată (2/3, pentru dobândirea sau înstrăinarea de bunuri imobile) de <b>"+cal+"</b> consilieri. "+
        "Introduceți numărul de prezenți pentru a afla majoritatea simplă.";
    }
    v.innerHTML = msg;
  }
  loc.addEventListener("input", calc);
  prez.addEventListener("input", calc);
  calc();
}

var PRAG = {
  ad_ps:270120, ad_l:900400,
  eu_ps_sub:1077624, eu_l:26960556, eu_soc:3741750
};
function praguriHTML(){
  return '<div class="calc">'+
    "<h4>Instrument — ce procedură de achiziție se aplică</h4>"+
    '<p class="calc-hint">Valoarea estimată se exprimă în lei, <b>fără TVA</b>, pentru întreaga durată a contractului. Praguri valabile din 1 ianuarie 2026, pentru autorități contractante <b>subcentrale</b> (UAT-uri).</p>'+
    '<div class="calc-row">'+
      '<div class="field"><label for="p-tip">Obiectul contractului</label><select id="p-tip">'+
        '<option value="ps">Produse sau servicii</option>'+
        '<option value="l">Lucrări</option>'+
        '<option value="soc">Servicii sociale și alte servicii specifice</option>'+
      "</select></div>"+
      '<div class="field"><label for="p-val">Valoare estimată (lei, fără TVA)</label><input id="p-val" type="number" min="0" step="100" value="150000"></div>'+
    "</div>"+
    '<div class="calc-out"><div class="out-grid">'+
      '<div class="out-box"><div class="k">Prag achiziție directă</div><div class="v" id="p-ad">–</div></div>'+
      '<div class="out-box"><div class="k">Prag european</div><div class="v" id="p-eu">–</div></div>'+
      '<div class="out-box"><div class="k">Până la pragul următor</div><div class="v" id="p-rest">–</div></div>'+
    "</div>"+
    '<div class="verdict" id="p-verdict"></div>'+
    '<p class="calc-hint" style="margin-top:12px">Rezultatul este orientativ. Verificați notificarea ANAP în vigoare, excepțiile legale și interdicția divizării artificiale a contractului.</p>'+
    "</div></div>";
}
function bindPraguri(){
  var tip = $("#p-tip"), val = $("#p-val");
  function calc(){
    var t = tip.value, v = Math.max(0, parseFloat(val.value)||0);
    var ad = (t==="l") ? PRAG.ad_l : PRAG.ad_ps;
    var eu = (t==="l") ? PRAG.eu_l : (t==="soc" ? PRAG.eu_soc : PRAG.eu_ps_sub);
    $("#p-ad").innerHTML = nf(ad)+' <small>lei</small>';
    $("#p-eu").innerHTML = nf(eu)+' <small>lei</small>';
    var next = v < ad ? ad : (v < eu ? eu : null);
    $("#p-rest").innerHTML = next ? nf(Math.max(0, next - v))+' <small>lei</small>' : '<small>peste pragul european</small>';

    var out;
    if(v < ad){
      out = "<b>Achiziție directă</b>Valoarea estimată este sub pragul de "+nf(ad)+" lei. Achiziția se poate realiza direct, de regulă prin catalogul electronic din SEAP, cu documentele justificative aferente (referat de necesitate, notă privind determinarea valorii estimate, comandă sau contract, recepție). Art. 7 alin. (5) din Legea nr. 98/2016.";
    } else if(v < eu){
      out = (t==="soc")
        ? "<b>Procedură proprie pentru servicii sociale</b>Valoarea estimată se află între pragul achiziției directe și pragul de "+nf(eu)+" lei. Autoritatea contractantă aplică procedura proprie, stabilită prin norme interne, cu respectarea principiilor și a regulilor de publicitate (art. 111 din Legea nr. 98/2016)."
        : "<b>Procedură simplificată</b>Valoarea estimată se află între pragul achiziției directe ("+nf(ad)+" lei) și pragul european ("+nf(eu)+" lei). Se organizează procedura simplificată, cu anunț de participare publicat în SEAP; termenele minime uzuale sunt de 10 zile pentru produse și servicii, 6 zile pentru produse de complexitate redusă și 15 zile pentru lucrări (art. 113).";
    } else {
      out = (t==="soc")
        ? "<b>Procedură de atribuire cu publicitate europeană</b>Valoarea estimată depășește pragul de "+nf(eu)+" lei pentru servicii sociale. Se aplică licitația deschisă, licitația restrânsă sau negocierea competitivă, cu publicarea anunțului în Jurnalul Oficial al Uniunii Europene."
        : "<b>Procedură de atribuire cu publicitate europeană</b>Valoarea estimată este la sau peste pragul de "+nf(eu)+" lei. Se aplică una dintre procedurile prevăzute de lege — de regulă licitația deschisă — cu publicarea anunțului de participare în Jurnalul Oficial al Uniunii Europene și aplicarea DUAE.";
    }
    $("#p-verdict").innerHTML = out;
  }
  tip.addEventListener("change", calc);
  val.addEventListener("input", calc);
  calc();
}

/* ---------- rutare ---------- */
var pendingBlock = null;
function route(){
  var h = (location.hash||"").replace(/^#/,"");
  if(!h){ renderSection(DATA[0].id); window.scrollTo(0,0); return; }
  var sec = DATA.find(function(s){return s.id===h;});
  if(sec){
    renderSection(h);
    if(pendingBlock!==null){
      var el = content.querySelector('[data-b="'+pendingBlock+'"]');
      pendingBlock = null;
      if(el){
        el.classList.add("flash");
        setTimeout(function(){ el.scrollIntoView({block:"center", behavior:"smooth"}); }, 30);
        setTimeout(function(){ el.classList.remove("flash"); }, 2200);
        return;
      }
    }
    window.scrollTo(0,0);
  } else {
    // ancoră internă (ex. #acte-h2) — ne asigurăm că secțiunea este randată
    var base = h.replace(/-h\d+$/,"");
    var s2 = DATA.find(function(x){return x.id===base;});
    if(s2){
      if(!content.querySelector("#"+CSS.escape(h))) renderSection(base);
      var t = document.getElementById(h);
      if(t) t.scrollIntoView({block:"start", behavior:"smooth"});
    }
  }
  document.body.classList.remove("nav-open");
}

/* ---------- inițializare ---------- */
buildNav();
buildIndex();
route();
window.addEventListener("hashchange", route);

content.addEventListener("click", function(e){
  var r = e.target.closest ? e.target.closest(".result") : null;
  if(r){
    pendingBlock = parseInt(r.getAttribute("data-b"),10);
    search.value = "";
    if(location.hash === r.getAttribute("href")){ e.preventDefault(); route(); }
  }
});
nav.addEventListener("click", function(){ document.body.classList.remove("nav-open"); });

var tmr;
search.addEventListener("input", function(){
  clearTimeout(tmr);
  var v = search.value;
  tmr = setTimeout(function(){ runSearch(v); }, 140);
});
search.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ search.value=""; search.blur(); route(); }
});
document.addEventListener("keydown", function(e){
  if(e.key==="/" && document.activeElement!==search){ e.preventDefault(); search.focus(); search.select(); }
});

/* temă */
var themeBtn = $("#themeBtn");
var saved = store("apl-theme");
if(saved){ document.documentElement.setAttribute("data-theme", saved); }
else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
  document.documentElement.setAttribute("data-theme","dark");
}
themeBtn.addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", cur);
  store("apl-theme", cur);
});

$("#printBtn").addEventListener("click", function(){ window.print(); });
$("#menuBtn").addEventListener("click", function(){ document.body.classList.toggle("nav-open"); });
$("#scrim").addEventListener("click", function(){ document.body.classList.remove("nav-open"); });
$("#footYear").textContent = "Actualizat: 2026 · " + DATA.length + " capitole · fișier unic HTML, fără dependențe externe";

})();
